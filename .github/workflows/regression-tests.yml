name: Regression Tests

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    container:
        image: quantconnect/lean:foundation
        options: --cpus 12 --memory 12g
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build
        run: dotnet build /p:Configuration=Release /v:quiet /p:WarningLevel=1 QuantConnect.Lean.sln

      - name: Run Tests
        run: |
          # Enable test host crash diagnostics (minidumps, crash reports, Python fault handler)
          . ./ci_test_diagnostics_env.sh

          mkdir -p TestResults
          dotnet test ./Tests/bin/Release/QuantConnect.Tests.dll \
            --blame-hang-timeout 15minutes --blame-hang-dump-type mini \
            --blame-crash --blame-crash-dump-type mini \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx" \
            --filter TestCategory=RegressionTests \
            -- TestRunParameters.Parameter\(name=\"log-handler\", value=\"ConsoleErrorLogHandler\"\) \
            TestRunParameters.Parameter\(name=\"reduced-disk-size\", value=\"true\"\)

      - name: Collect test diagnostics
        if: failure()
        uses: ./.github/actions/collect-test-diagnostics
        with:
          artifact-name-prefix: regression-test-results
