name: Regression Tests

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    container:
        image: quantconnect/lean:foundation
        options: --cpus 12 --memory 12g
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build
        run: dotnet build /p:Configuration=Release /v:quiet /p:WarningLevel=1 QuantConnect.Lean.sln

      - name: Run Tests
        run: |
          # Enable test host crash diagnostics (minidumps, crash reports, Python fault handler)
          . ./ci_test_diagnostics_env.sh

          mkdir -p TestResults
          dotnet test ./Tests/bin/Release/QuantConnect.Tests.dll \
            --blame-hang-timeout 15minutes --blame-hang-dump-type mini \
            --blame-crash --blame-crash-dump-type mini \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx" \
            --filter TestCategory=RegressionTests \
            -- TestRunParameters.Parameter\(name=\"log-handler\", value=\"ConsoleErrorLogHandler\"\) \
            TestRunParameters.Parameter\(name=\"reduced-disk-size\", value=\"true\"\)

      - name: Summarize failures
        if: failure()
        run: ./ci_summarize_test_failures.sh

      - name: Upload crash dumps and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults/**/*.dmp
            TestResults/**/*.crashreport.json
            TestResults/**/Sequence_*.xml
            TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: ignore
